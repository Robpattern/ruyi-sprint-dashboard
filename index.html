<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Ruyi · Sprint Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" crossorigin="anonymous"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }

/* Header */
.header { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); color: white; padding: 20px 28px 0; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 16px; }
.header-left h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
.header-left .sub { font-size: 12px; color: #94a3b8; margin-top: 3px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.badge { border-radius: 20px; padding: 4px 13px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge-active   { background: rgba(16,185,129,.18); border: 1px solid rgba(16,185,129,.35); color: #34d399; }
.badge-planning { background: rgba(251,191,36,.18); border: 1px solid rgba(251,191,36,.35); color: #fbbf24; }
.badge-complete { background: rgba(148,163,184,.18); border: 1px solid rgba(148,163,184,.35); color: #94a3b8; }

.sync-btn { display: flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; color: white; font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s; }
.sync-btn:hover:not(:disabled) { background: rgba(255,255,255,.18); }
.sync-btn:disabled { opacity: .6; cursor: not-allowed; }
.sync-btn.spinning .sync-icon { animation: spin .8s linear infinite; }
.sync-icon { display: inline-block; font-size: 13px; }
@keyframes spin { to { transform: rotate(360deg); } }
.last-synced { font-size: 10px; color: #64748b; white-space: nowrap; }

/* Sprint bar */
.sprint-bar-wrap { padding: 0 0 14px; }
.sprint-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 5px; }
.sprint-bar-track { height: 5px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; }
.sprint-bar-fill { height: 100%; background: #3b82f6; border-radius: 3px; transition: width .4s; }

/* Tabs */
.tabs { display: flex; overflow-x: auto; }
.tab { flex-shrink: 0; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; color: #94a3b8; border-bottom: 3px solid transparent; transition: all .15s; user-select: none; }
.tab:hover { color: #e2e8f0; }
.tab.active { color: white; border-bottom-color: #3b82f6; }

/* Panels */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 18px 28px; }
.card { background: white; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
.card-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .6px; margin-bottom: 14px; }
.full { grid-column: 1 / -1; }
.loading { color: #94a3b8; font-size: 13px; padding: 8px 0; }

/* Chips */
.chip-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.chip { text-align: center; padding: 13px 6px; border-radius: 10px; }
.chip .n { font-size: 26px; font-weight: 800; line-height: 1; }
.chip .lbl { font-size: 10px; color: #64748b; margin-top: 3px; font-weight: 500; }
.c-green  { background: #d1fae5; color: #059669; }
.c-purple { background: #ede9fe; color: #6d28d9; }
.c-yellow { background: #fef3c7; color: #d97706; }
.c-gray   { background: #f1f5f9; color: #475569; }
.c-blue   { background: #dbeafe; color: #1d4ed8; }

/* Assignee bars */
.asgn-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.asgn-row:last-child { margin-bottom: 0; }
.av { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; flex-shrink: 0; }
.asgn-name { font-size: 12px; font-weight: 600; min-width: 60px; }
.asgn-bar-track { flex: 1; height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
.asgn-bar-fill { height: 100%; border-radius: 4px; }
.asgn-val { font-size: 12px; font-weight: 700; color: #6d28d9; min-width: 50px; text-align: right; }

/* Task rows */
.task-row { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f8f9fa; }
.task-row:last-child { border: none; }
.task-id { font-size: 10px; color: #94a3b8; font-weight: 700; min-width: 85px; }
.task-id a { color: inherit; text-decoration: none; }
.task-id a:hover { color: #3b82f6; }
.task-name { font-size: 12px; font-weight: 500; flex: 1; }
.task-pts { font-size: 11px; font-weight: 700; color: #6d28d9; white-space: nowrap; }
.task-who { font-size: 11px; color: #64748b; white-space: nowrap; }
.done-task .task-name { text-decoration: line-through; color: #94a3b8; }

/* Sprint items */
.sprint-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; }
.sprint-item:hover .pts-edit-hint { opacity: 1 !important; }
.sprint-item:last-child { margin-bottom: 0; }
.tid { font-size: 10px; font-weight: 700; color: #94a3b8; }
.tid a { color: inherit; text-decoration: none; }
.tid a:hover { color: #3b82f6; }
.tname { font-size: 12px; font-weight: 600; }
.ta { font-size: 11px; color: #64748b; margin-top: 2px; }

/* Status badge */
.st-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.st-blocked    { background: #fee2e2; color: #dc2626; }
.st-inprogress { background: #dbeafe; color: #2563eb; }
.st-done       { background: #d1fae5; color: #059669; }
.st-notest     { background: #fef3c7; color: #d97706; }

/* Priority badge */
.pri-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: capitalize; }
.pri-urgent { background: #fee2e2; color: #dc2626; }
.pri-high   { background: #fef3c7; color: #d97706; }
.pri-normal { background: #dbeafe; color: #2563eb; }
.pri-low    { background: #f1f5f9; color: #64748b; }

/* Burndown */
.bd-header { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 18px; }
.bd-stat .bd-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; }
.bd-stat .bd-val   { font-size: 18px; font-weight: 800; }
.bd-stat .bd-sub   { font-size: 11px; color: #64748b; }
.bd-val.pos { color: #10b981; }

/* Donut */
.donut-wrap { position: relative; width: 145px; height: 145px; margin: 0 auto 8px; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
.donut-center .big { font-size: 24px; font-weight: 800; }
.donut-center .sm  { font-size: 10px; color: #94a3b8; }
.legend { display: flex; flex-wrap: wrap; gap: 5px 10px; justify-content: center; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #64748b; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* Backlog table */
.bl-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.bl-table th { text-align: left; font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; padding: 6px 8px; border-bottom: 2px solid #f1f5f9; }
.bl-table td { padding: 8px; border-bottom: 1px solid #f8f9fa; vertical-align: top; }
.bl-table tr:last-child td { border: none; }
.bl-table td a { color: #94a3b8; text-decoration: none; font-size: 11px; font-weight: 700; }
.bl-table td a:hover { color: #3b82f6; }

/* Planning note */
.planning-note { background: #fef9c3; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #92400e; margin-bottom: 14px; }

/* Error banner */
.error-banner { background: #fee2e2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px 16px; font-size: 12px; color: #dc2626; margin: 18px; }
</style>
</head>
<body>
<!-- Points override popover -->
<div id="pts-popover" style="display:none;position:absolute;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:9999;min-width:220px">
  <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:4px">Override remaining points</div>
  <div style="font-size:11px;color:#94a3b8;margin-bottom:10px">Full scope: <strong id="pts-full" style="color:#6d28d9"></strong>pt</div>
  <input id="pts-input" type="number" min="0" placeholder="Remaining pts…"
    style="width:100%;box-sizing:border-box;border:1.5px solid #d1d5db;border-radius:6px;padding:7px 10px;font-size:14px;font-weight:600;color:#1e293b;margin-bottom:10px;outline:none"
    onkeydown="if(event.key==='Enter')applyPtsOverride()">
  <div style="display:flex;gap:6px">
    <button onclick="applyPtsOverride()" style="flex:1;background:#6d28d9;color:#fff;border:none;border-radius:6px;padding:7px;cursor:pointer;font-size:12px;font-weight:700">Save</button>
    <button onclick="clearPtsOverride()" style="flex:1;background:#f1f5f9;color:#64748b;border:none;border-radius:6px;padding:7px;cursor:pointer;font-size:12px">Clear</button>
    <button onclick="closePtsPopover()" style="background:#f1f5f9;color:#94a3b8;border:none;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px">✕</button>
  </div>
</div>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <h1>🏮 Team Ruyi (如意) · Sprint Dashboard</h1>
      <div class="sub" id="header-sub">Loading sprints…</div>
    </div>
    <div class="header-right">
      <span class="last-synced" id="last-synced">Never synced</span>
      <button class="sync-btn" id="sync-btn" onclick="syncNow()">
        <span class="sync-icon" id="sync-icon">↻</span> Sync
      </button>
      <span class="badge badge-active" id="header-badge">Loading</span>
    </div>
  </div>

  <div class="sprint-bar-wrap" id="sprint-bar-wrap" style="display:none">
    <div class="sprint-bar-labels">
      <span id="bar-start"></span><span id="bar-pct"></span><span id="bar-end"></span>
    </div>
    <div class="sprint-bar-track"><div class="sprint-bar-fill" id="sprint-bar" style="width:0%"></div></div>
  </div>

  <div class="tabs" id="tabs-container"></div>
</div>

<div id="panels-container"></div>

<script>
/* ══════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════ */
const RUYI_FOLDER_ID  = '90172589900';
const BACKLOG_LIST_ID = '901705110942';

// Extra task IDs to always fetch for specific sprint lists (multi-list tasks missing from view)
const SPRINT_EXTRA_IDS = {
  '901713532382': ['ATECH-7436', 'ATECH-7339', 'ATECH-7342', 'ATECH-7345', 'ATECH-7607'],
  '901713532383': ['ATECH-7436', 'ATECH-7607'], // Sprint 11: carry-overs from S10
};
const TEAM_ID = '2323726';

// Team-confirmed planned commitments per sprint (overrides live sum for delta widget)
// Ryan's 18 was double-counting ATECH-7440 parent (3pt) + its subtasks (3x1pt) — true scope is 15pt
const SPRINT_PLANNED = {
  '901713532382': { 'ryan ruan': 15, 'vincent qiao': 26 },
};

// Tasks added mid-sprint (date_created > sprint start) — detected via API
const SPRINT_MID_ADDITIONS = {
  '901713532382': [
    { id: 'ATECH-7558', name: 'Retrieve the JD Recommended Keywords', pts: 5, who: 'Vincent', date: 'Jun 17', note: 'Added sprint start day' },
    { id: 'ATECH-7607', name: '[Impl] Tmall SP — Target Audience Multiplier', pts: 0, who: 'Vincent', date: 'Jun 22', note: 'Added mid-sprint, unestimated' },
  ],
};

// Verified point fallbacks for older sprints (REST API may return null)
const FALLBACK_POINTS = {
  'ATECH-7270': 3, 'ATECH-7315': 5, 'ATECH-7338': 5, 'ATECH-7348': 3,
  'ATECH-7418': 5, 'ATECH-7419': 3, 'ATECH-7420': 3, 'ATECH-7421': 2,
  'ATECH-7440': 3, 'ATECH-7439': 3, 'ATECH-7438': 2, 'ATECH-7441': 2,
  'ATECH-7517': 5, 'ATECH-7436': 8, 'ATECH-7339': 3, 'ATECH-7342': 3,
  'ATECH-7345': 3, 'ATECH-7558': 5, 'ATECH-7305': 3, 'ATECH-7186': 2,
  'ATECH-7503': 2, 'ATECH-7607': 18,
};

// Points remaining override — use when sprint planning revises the remaining scope
// downward from what ClickUp shows. Edit the number here; dashboard shows it with a "rem" badge.
// Format: 'TASK-ID': remaining_points
const POINTS_REMAINING = {
  'ATECH-7607': 10,  // 18pt total; ~10pt remaining per Sprint 11 planning
};

const MEMBER_COLORS = {
  'vincent qiao': '#6366f1', 'ryan ruan': '#3b82f6', 'james tan': '#f59e0b',
  'mio jia': '#ec4899',     'robert wang': '#10b981', 'zowie meng': '#14b8a6',
  'kevin liu': '#8b5cf6',
};

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let currentTab = 0;
let sprintSlots = [];   // [{list, role:'review'|'active'|'planning'}]
let charts = {};
let cachedTasks = {}; // panelId -> tasks array
let cachedBlTasks = [];
let syncedAt = null;

// Points remaining overrides — persisted to localStorage
let pointsOverrides = JSON.parse(localStorage.getItem('ruyi_pts_override') || '{}');

function savePointsOverride(customId, pts) {
  if (pts === null) { delete pointsOverrides[customId]; }
  else { pointsOverrides[customId] = pts; }
  localStorage.setItem('ruyi_pts_override', JSON.stringify(pointsOverrides));
  rerenderAll();
}

function rerenderAll() {
  sprintSlots.forEach((s, i) => {
    const panelId = `panel-${i}`;
    const tasks = cachedTasks[panelId] || [];
    const prevTasks = i > 0 ? (cachedTasks[`panel-${i-1}`] || []) : [];
    if (s.role === 'review')   renderReview(panelId, s, tasks);
    if (s.role === 'active')   renderActive(panelId, s, tasks);
    if (s.role === 'planning') renderPlanning(panelId, s, tasks, prevTasks, cachedBlTasks);
  });
}

// Points override popover state
let _popoverTaskId = null;
let _popoverFull   = 0;

function openPtsPopover(el, customId, full) {
  _popoverTaskId = customId;
  _popoverFull   = full;
  const pop = document.getElementById('pts-popover');
  const cur = pointsOverrides[customId] ?? POINTS_REMAINING[customId];
  document.getElementById('pts-full').textContent = full;
  document.getElementById('pts-input').value = cur != null ? cur : full;
  // Position near clicked element
  const rect = el.getBoundingClientRect();
  pop.style.top  = (rect.bottom + 8 + window.scrollY) + 'px';
  pop.style.left = Math.min(rect.left, window.innerWidth - 230) + 'px';
  pop.style.display = 'block';
  setTimeout(() => document.getElementById('pts-input').focus(), 50);
}
function closePtsPopover() {
  document.getElementById('pts-popover').style.display = 'none';
  _popoverTaskId = null;
}
function applyPtsOverride() {
  const v = parseInt(document.getElementById('pts-input').value, 10);
  if (!isNaN(v) && _popoverTaskId) savePointsOverride(_popoverTaskId, v === _popoverFull ? null : v);
  closePtsPopover();
}
function clearPtsOverride() {
  if (_popoverTaskId) savePointsOverride(_popoverTaskId, null);
  closePtsPopover();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePtsPopover(); });

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
const isTest = t => /Test Bug|测试/.test(t.name || '');
const getStatus = t => (t.status?.status || t.status || '').toLowerCase();
const memberColor = name => {
  const k = Object.keys(MEMBER_COLORS).find(k => k === (name||'').toLowerCase());
  return k ? MEMBER_COLORS[k] : '#94a3b8';
};
const memberInitials = name =>
  (name||'?').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();

function getPoints(t) {
  return FALLBACK_POINTS[t.custom_id]
    ?? (t.points != null ? Number(t.points) || 0 : 0);
}

// Returns { pts, html } — pts is what to use for math, html is the clickable points badge.
// Checks pointsOverrides (localStorage) first, then POINTS_REMAINING (hardcoded seeds).
function getPointsDisplay(t) {
  const full = getPoints(t);
  const cid  = t.custom_id || '';
  const rem  = pointsOverrides[cid] ?? POINTS_REMAINING[cid];
  const click = `onclick="openPtsPopover(this,'${cid}',${full})" title="Click to override remaining points" style="cursor:pointer"`;
  if (rem != null && rem !== full) {
    const html = `<span ${click} style="display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:800;color:#6d28d9">
      ${rem}pt
      <span style="font-size:10px;font-weight:400;color:#94a3b8;text-decoration:line-through">${full}</span>
      <span style="font-size:9px;font-weight:700;color:#d97706;background:#fef3c7;padding:1px 5px;border-radius:3px;line-height:1.4">rem</span>
    </span>`;
    return { pts: rem, html };
  }
  const html = `<span ${click} style="display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:800;color:#6d28d9">
    ${full > 0 ? full + 'pt' : '<span style="font-size:11px;color:#cbd5e1">— pt</span>'}
    <span style="font-size:9px;opacity:0;transition:opacity .15s" class="pts-edit-hint">✏️</span>
  </span>`;
  return { pts: full, html };
}

function fmtTime(d) {
  const diff = Math.round((new Date() - d) / 60000);
  if (diff < 1) return 'just now';
  if (diff < 60) return `${diff}m ago`;
  return `${Math.round(diff/60)}h ago`;
}

function parseSprintDates(name) {
  // Matches "Sprint N (M/DD - M/DD)" or "Sprint N (M/DD/YY - M/DD/YY)"
  const m = name.match(/\((\d+)\/(\d+)(?:\/(\d+))?\s*-\s*(\d+)\/(\d+)(?:\/(\d+))?\)/);
  if (!m) return { start: null, end: null };
  const now = new Date();
  const yr = now.getFullYear();
  const startYr = m[3] ? (parseInt(m[3]) < 100 ? 2000 + parseInt(m[3]) : parseInt(m[3])) : yr;
  const endYr   = m[6] ? (parseInt(m[6]) < 100 ? 2000 + parseInt(m[6]) : parseInt(m[6])) : startYr;
  let start = new Date(startYr, parseInt(m[1])-1, parseInt(m[2]));
  let end   = new Date(endYr,   parseInt(m[4])-1, parseInt(m[5]));
  // If both parsed to this year and end appears to be before start (year boundary), bump end
  if (end < start) end.setFullYear(end.getFullYear() + 1);
  // If end is >5 months ago relative to now, assume next year
  if (end < new Date(now - 150*86400000)) {
    start.setFullYear(start.getFullYear()+1);
    end.setFullYear(end.getFullYear()+1);
  }
  return { start, end };
}

/* ══════════════════════════════════════════
   API
══════════════════════════════════════════ */
async function api(path, params = {}) {
  const qs = new URLSearchParams(params).toString();
  const url = `/api/clickup?path=${encodeURIComponent(path)}${qs ? '&' + qs : ''}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`API ${r.status} for ${path}`);
  return r.json();
}

async function fetchViewTasks(viewId) {
  let all = [], page = 0, last = 100;
  while (last === 100 && page < 10) {
    const d = await api(`/v2/view/${viewId}/task`, { page });
    const batch = d.tasks || [];
    // Fetch detailed version (with subtasks) to get points
    const detailed = await Promise.allSettled(batch.map(t => api(`/v2/task/${t.id}`, { include_subtasks: true })));
    const good = detailed.filter(r=>r.status==='fulfilled'&&r.value?.id).map(r => {
      const task = r.value;
      // Roll up subtask points when parent has no points set (ClickUp UI shows rollup)
      if ((task.points == null) && task.subtasks?.length) {
        const rollup = task.subtasks.reduce((s, sub) => s + (Number(sub.points) || 0), 0);
        if (rollup > 0) task.points = rollup;
      }
      return task;
    });
    all = all.concat(good);
    last = batch.length;
    page++;
  }
  return all;
}

async function fetchListTasks(listId) {
  let all = [], page = 0, last = 100;
  while (last === 100 && page < 10) {
    const d = await api(`/v2/list/${listId}/task`, { include_closed: false, page });
    all = all.concat(d.tasks || []);
    last = (d.tasks||[]).length;
    page++;
  }
  return all;
}

async function getBoardViewId(listId) {
  try {
    const d = await api(`/v2/list/${listId}/view`);
    const views = d.views || [];
    // Only use view types that support the /task endpoint
    const VALID_TYPES = new Set(['board', 'list', 'calendar', 'gantt', 'activity', 'workload']);
    const board = views.find(v => v.type === 'board')
      || views.find(v => v.type === 'list')
      || views.find(v => VALID_TYPES.has(v.type));
    return board?.id || null;
  } catch { return null; }
}

async function fetchSprintTasks(listId) {
  const viewId = await getBoardViewId(listId);
  const base = viewId ? await fetchViewTasks(viewId) : await fetchListTasks(listId);

  // Supplement with any known extra tasks for this sprint (multi-list tasks missing from view)
  const extraIds = SPRINT_EXTRA_IDS[listId] || [];
  if (extraIds.length) {
    const existing = new Set(base.map(t => t.custom_id));
    const extras = await Promise.allSettled(
      extraIds.filter(id => !existing.has(id)).map(id =>
        api(`/v2/task/${id}`, { custom_task_ids: true, team_id: TEAM_ID, include_subtasks: true })
      )
    );
    extras.forEach(r => { if (r.status === 'fulfilled' && r.value?.id) base.push(r.value); });
  }

  // Remove parent "container" tasks whose children are also in the result
  // (board views sometimes include the parent when a subtask is in the sprint)
  const childParentIds = new Set(base.filter(t => t.parent).map(t => t.parent));
  return base.filter(t => !childParentIds.has(t.id));
}

/* ══════════════════════════════════════════
   SPRINT DISCOVERY
══════════════════════════════════════════ */
async function discoverSprints() {
  const d = await api(`/v2/folder/${RUYI_FOLDER_ID}/list`);
  const lists = (d.lists || []).filter(l => /Sprint \d+/i.test(l.name));
  return lists.map(l => {
    const numMatch = l.name.match(/Sprint (\d+)/i);
    const { start, end } = parseSprintDates(l.name);
    return { id: l.id, name: l.name, num: numMatch ? parseInt(numMatch[1]) : 0, start, end };
  }).sort((a,b) => a.num - b.num);
}

function pickDisplaySprints(allSprints) {
  const now = new Date();
  const activeIdx = allSprints.findIndex(s => s.start && s.end && now >= s.start && now <= s.end);
  if (activeIdx >= 0) {
    const prev = activeIdx > 0 ? allSprints[activeIdx-1] : null;
    const curr = allSprints[activeIdx];
    const next = activeIdx+1 < allSprints.length ? allSprints[activeIdx+1] : null;
    return [
      prev ? { ...prev, role: 'review' } : null,
      { ...curr, role: 'active' },
      next ? { ...next, role: 'planning' } : null,
    ].filter(Boolean);
  }
  // No active sprint — show last 2 + next upcoming
  const upcoming = allSprints.find(s => s.start && s.start > now);
  if (upcoming) {
    const ui = allSprints.indexOf(upcoming);
    return [
      ui > 1 ? { ...allSprints[ui-2], role: 'review' } : null,
      { ...allSprints[ui-1], role: 'review' },
      { ...upcoming, role: 'planning' },
    ].filter(Boolean);
  }
  return allSprints.slice(-3).map((s,i,a) => ({ ...s, role: i===a.length-1?'review':'review' }));
}

/* ══════════════════════════════════════════
   HEADER / TABS
══════════════════════════════════════════ */
function buildTabs(slots) {
  const labels = slots.map(s => {
    const n = s.name.match(/Sprint (\d+)/i)?.[1] || '?';
    return s.role === 'review' ? `Sprint ${n} Review`
         : s.role === 'active' ? `Sprint ${n} Active`
         : `Sprint ${n} Planning`;
  });
  document.getElementById('tabs-container').innerHTML = labels.map((lbl,i) =>
    `<div class="tab${i===0?' active':''}" onclick="switchTab(${i})">${lbl}</div>`
  ).join('');

  document.getElementById('panels-container').innerHTML = slots.map((_,i) =>
    `<div class="tab-panel${i===0?' active':''}" id="panel-${i}"><div class="loading" style="padding:24px">Loading…</div></div>`
  ).join('');
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-panel').forEach((el,i) => el.classList.toggle('active', i===idx));
  updateHeader(idx);
}

function updateHeader(idx) {
  const s = sprintSlots[idx];
  if (!s) return;
  const now = new Date();
  const isPast   = s.end   && now > s.end;
  const isFuture = s.start && now < s.start;
  const isActive = !isPast && !isFuture;
  const n = s.name.match(/Sprint (\d+)/i)?.[1];

  document.getElementById('header-sub').textContent =
    `Sprint ${n}  ·  ${s.start ? s.start.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '?'} – ${s.end ? s.end.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '?'}`;

  const badge = document.getElementById('header-badge');
  badge.textContent = isPast ? '✅ Complete' : isFuture ? '📋 Planning' : '🟢 Active';
  badge.className   = 'badge ' + (isActive ? 'badge-active' : isFuture ? 'badge-planning' : 'badge-complete');

  const barWrap = document.getElementById('sprint-bar-wrap');
  if (s.start && s.end) {
    barWrap.style.display = 'block';
    const pct = Math.round(Math.min(Math.max((now-s.start)/(s.end-s.start),0),1)*100);
    document.getElementById('bar-start').textContent = s.start.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    document.getElementById('bar-end').textContent   = s.end.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    document.getElementById('bar-pct').textContent   = isFuture ? 'Not started' : isPast ? 'Sprint complete' : `${pct}% through`;
    document.getElementById('sprint-bar').style.width = pct + '%';
  } else {
    barWrap.style.display = 'none';
  }
}

    for (let i=0;i<days;i++) {

      if (d<=new Date()) {

          return ts>0&&new Date(ts)<=d?sum+getPoints(t):sum;

        remain.push(Math.max(totalPts-cp,0));

/* ══════════════════════════════════════════
   VIEW MODE TOGGLE (active sprints)
══════════════════════════════════════════ */
const panelViewMode = {}; // panelId -> 'active' | 'review'

function toggleViewMode(panelId, s, tasks) {
  panelViewMode[panelId] = panelViewMode[panelId] === 'review' ? 'active' : 'review';
  if (panelViewMode[panelId] === 'review') renderReview(panelId, s, tasks, true);
  else renderActive(panelId, s, tasks);
}

/* ══════════════════════════════════════════
   RENDER — ACTIVE sprint
══════════════════════════════════════════ */
function renderActive(panelId, s, tasks) {
  tasks = tasks.filter(t => !isTest(t));
  const el = document.getElementById(panelId);

  const ptsByA = {}, tasksByA = {}, taskListByA = {};
  tasks.forEach(t => {
    const {pts} = getPointsDisplay(t);
    const assignees = t.assignees||[];
    const hasPerAssigneePoints = assignees.some(a => a.points != null);
    assignees.forEach(a => {
      const n = a.username||'?';
      // Use ClickUp's per-assignee breakdown if available, else split evenly
      const share = hasPerAssigneePoints
        ? (Number(a.points) || 0)
        : (assignees.length > 1 ? Math.round((pts / assignees.length) * 10) / 10 : pts);
      ptsByA[n]      = (ptsByA[n]     ||0) + share;
      tasksByA[n]    = (tasksByA[n]   ||0) + 1;
      taskListByA[n] = (taskListByA[n]||[]);
      taskListByA[n].push({ id: t.custom_id, name: t.name, pts: share, full: pts, shared: assignees.length > 1, url: t.url, status: getStatus(t) });
    });
  });
  // Round to avoid floating point display
  Object.keys(ptsByA).forEach(k => { ptsByA[k] = Math.round(ptsByA[k] * 10) / 10; });

  const totalPts  = Object.values(ptsByA).reduce((s,v)=>s+v,0);
  const closed    = tasks.filter(t=>getStatus(t)==='closed');
  const closedPts = closed.reduce((s,t)=>s+getPointsDisplay(t).pts,0);
  const pctDone   = Math.round(closedPts/Math.max(totalPts,1)*100);

  const ptsEntries = Object.entries(ptsByA).sort((a,b)=>b[1]-a[1]);
  const tskEntries = Object.entries(tasksByA).sort((a,b)=>b[1]-a[1]);
  const maxPts = Math.max(...ptsEntries.map(([,v])=>v),1);
  const maxTsk = Math.max(...tskEntries.map(([,v])=>v),1);

  const statusOrder = {'in progress':0,'prioritized':1,'blocked':2,'closed':3};
  const sorted = [...tasks].sort((a,b)=>(statusOrder[getStatus(a)]??4)-(statusOrder[getStatus(b)]??4));

  panelViewMode[panelId] = 'active';
  el.innerHTML = `
    <div class="grid">
      <div class="card full">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="chip-row" style="flex:1">
            <div class="chip c-green"><div class="n">${tasks.length}</div><div class="lbl">Tasks</div></div>
            <div class="chip c-purple"><div class="n">${totalPts}</div><div class="lbl">Sprint Points</div></div>
            <div class="chip c-yellow"><div class="n">${pctDone}%</div><div class="lbl">% Complete</div></div>
            <div class="chip c-gray"><div class="n">${totalPts-closedPts}</div><div class="lbl">Pts Remaining</div></div>
          </div>
          <button onclick="toggleViewMode('${panelId}', sprintSlots[${sprintSlots.findIndex(x=>x.id===s.id)}], cachedTasks['${panelId}'])" style="margin-left:14px;padding:6px 14px;border-radius:8px;border:1px solid #e2e8f0;background:white;font-size:12px;font-weight:600;cursor:pointer;color:#475569;white-space:nowrap">📉 Review View</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🎯 Points by Assignee <span style="font-size:10px;font-weight:400;color:#94a3b8">(click to expand)</span></div>
        ${ptsEntries.map(([name,pts])=>{
          const color = memberColor(name);
          const tid = 'breakdown-' + name.replace(/\s+/g,'_');
          const tl = (taskListByA[name]||[]).sort((a,b)=>b.pts-a.pts);
          const breakdownRows = tl.map(tk=>{
            const done = tk.status==='closed'||tk.status==='done';
            const statusDot = tk.status==='blocked'?'🚫':tk.status==='in progress'?'🔵':done?'✅':'⬜';
            return `<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-top:1px solid #f1f5f9">
              <span style="font-size:10px;width:16px;text-align:center">${statusDot}</span>
              <a href="${tk.url}" target="_blank" style="font-size:10px;font-weight:600;color:#94a3b8;text-decoration:none;white-space:nowrap">${tk.id}</a>
              <span style="font-size:11px;flex:1;color:${done?'#94a3b8':'#374151'};${done?'text-decoration:line-through':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${tk.name}</span>
              <span style="font-size:11px;font-weight:700;color:${color};white-space:nowrap">${tk.pts}pt${tk.shared?` <span style="font-size:9px;color:#94a3b8">(of ${tk.full})</span>`:''}</span>
            </div>`;
          }).join('');
          return `<div style="margin-bottom:4px">
            <div class="asgn-row" onclick="document.getElementById('${tid}').style.display=document.getElementById('${tid}').style.display==='none'?'block':'none'" style="cursor:pointer">
              <div class="av" style="background:${color}">${memberInitials(name)}</div>
              <div class="asgn-name">${name.split(' ')[0]}</div>
              <div class="asgn-bar-track"><div class="asgn-bar-fill" style="width:${Math.round(pts/maxPts*100)}%;background:${color}"></div></div>
              <div class="asgn-val">${pts} pts</div>
            </div>
            <div id="${tid}" style="display:none;padding:4px 8px 4px 36px;background:#f8fafc;border-radius:6px;margin-top:2px;font-size:11px">
              ${breakdownRows}
              <div style="padding-top:4px;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;margin-top:4px">
                ${tl.length} tasks · ${pts}pt total${tl.some(t=>t.shared)?' · shared tasks split evenly':''}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>

      <div class="card">
        <div class="card-title">📋 Tasks by Assignee</div>
        ${tskEntries.map(([name,cnt])=>`
          <div class="asgn-row">
            <div class="av" style="background:${memberColor(name)}">${memberInitials(name)}</div>
            <div class="asgn-name">${name.split(' ')[0]}</div>
            <div class="asgn-bar-track"><div class="asgn-bar-fill" style="width:${Math.round(cnt/maxTsk*100)}%;background:${memberColor(name)}"></div></div>
            <div class="asgn-val">${cnt} tasks</div>
          </div>`).join('')}
      </div>

      ${(()=>{
        const blocked = tasks.filter(t=>getStatus(t)==='blocked');
        if (!blocked.length) return '';
        return `<div class="card full" style="border:1.5px solid #fca5a5">
          <div class="card-title" style="color:#dc2626">🚫 Blocked Items (${blocked.length})</div>
          ${blocked.map(t=>{
            const {html:ptsHtml}=getPointsDisplay(t);
            return `<div class="sprint-item" style="background:#fff7f7;border-left:3px solid #ef4444">
              <div style="min-width:88px"><div class="tid"><a href="${t.url}" target="_blank">${t.custom_id}</a></div><span class="st-badge st-blocked">BLOCKED</span></div>
              <div style="flex:1"><div class="tname">${t.name}</div><div class="ta">${(t.assignees||[]).map(a=>a.username.split(' ')[0]).join(', ')||'Unassigned'}</div></div>
              ${ptsHtml}
            </div>`;
          }).join('')}
        </div>`;
      })()}

      <div class="card full">
        <div class="card-title">📌 All Tasks</div>
        ${sorted.map(t=>{
          const {pts, html: ptsHtml} = getPointsDisplay(t);
          const sl  = getStatus(t);
          const badge = sl==='blocked'?'<span class="st-badge st-blocked">BLOCKED</span>'
                      : sl==='in progress'?'<span class="st-badge st-inprogress">IN PROGRESS</span>'
                      : sl==='closed'?'<span class="st-badge st-done">DONE</span>':'';
          const bg = sl==='blocked'?'#fff7ed':sl==='closed'?'#f0fdf4':sl==='in progress'?'#eff6ff':'#fafafa';
          const bl = sl==='blocked'?'#f97316':sl==='closed'?'#10b981':sl==='in progress'?'#3b82f6':'#e2e8f0';
          const subs = (pts > 8 && t.subtasks?.length) ? t.subtasks.map(sub => {
            const sp = Number(sub.points) || 0;
            const ss = (sub.status?.status||sub.status||'').toLowerCase();
            const sDone = ss==='closed'||ss==='done';
            return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0 3px 12px;border-top:1px solid rgba(0,0,0,.05)">
              <span style="font-size:9px;color:#94a3b8">↳</span>
              <a href="${sub.url}" target="_blank" style="font-size:10px;font-weight:600;color:#94a3b8;text-decoration:none;white-space:nowrap">${sub.custom_id||''}</a>
              <span style="font-size:11px;flex:1;color:${sDone?'#94a3b8':'#374151'};${sDone?'text-decoration:line-through':''}">${(sub.name||'').length>50?(sub.name||'').slice(0,50)+'…':(sub.name||'')}</span>
              ${sp?`<span style="font-size:10px;font-weight:700;color:#6d28d9">${sp}pt</span>`:''}
              ${sDone?'<span style="font-size:9px;color:#059669">✓</span>':''}
            </div>`;
          }).join('') : '';
          return `<div class="sprint-item" style="background:${bg};border-left:3px solid ${bl};flex-direction:column;align-items:stretch;padding:0">
            <div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px">
              <div style="min-width:88px"><div class="tid"><a href="${t.url}" target="_blank">${t.custom_id}</a></div>${badge}</div>
              <div style="flex:1"><div class="tname">${t.name}</div><div class="ta">${(t.assignees||[]).map(a=>a.username.split(' ')[0]).join(', ')||'Unassigned'}</div></div>
              ${ptsHtml}
            </div>
            ${subs}
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

/* ══════════════════════════════════════════
   RENDER — PLANNING (future sprint)
══════════════════════════════════════════ */
function renderPlanning(panelId, s, tasks, prevTasks, blTasks) {
  tasks = tasks.filter(t => !isTest(t));
  const el = document.getElementById(panelId);
  const now = new Date();
  const daysUntil = s.start ? Math.max(0, Math.ceil((s.start-now)/86400000)) : '?';
  const unest = tasks.filter(t => !getPoints(t)).length;

  const ptsByA = {};
  tasks.forEach(t => {
    const pts = getPoints(t);
    (t.assignees||[]).forEach(a => {
      const n = a.username||'?';
      ptsByA[n] = (ptsByA[n]||0) + pts;
    });
  });
  const totalPts = Object.values(ptsByA).reduce((s,v)=>s+v,0);
  const ptsEntries = Object.entries(ptsByA).sort((a,b)=>b[1]-a[1]);
  const maxPts = Math.max(...ptsEntries.map(([,v])=>v),1);

  // Carryover: in-progress tasks from previous sprint
  const carryover = (prevTasks||[]).filter(t=>getStatus(t)==='in progress'&&!isTest(t));

  // Backlog candidates
  const s11ids = new Set(tasks.map(t=>t.custom_id));
  const candidates = (blTasks||[])
    .filter(t => ['prioritized','in progress'].includes(getStatus(t)) && !isTest(t) && !s11ids.has(t.custom_id))
    .sort((a,b) => ({urgent:0,high:1,normal:2,low:3}[(a.priority?.priority||'')]??4) - ({urgent:0,high:1,normal:2,low:3}[(b.priority?.priority||'')]??4))
    .slice(0,12);

  el.innerHTML = `
    <div class="grid">
      <div class="card full">
        <div class="chip-row">
          <div class="chip c-blue"><div class="n">${tasks.length}</div><div class="lbl">Committed</div></div>
          <div class="chip c-purple"><div class="n">${totalPts||'?'}</div><div class="lbl">Sprint Points</div></div>
          <div class="chip c-yellow"><div class="n">${unest}</div><div class="lbl">Not Estimated</div></div>
          <div class="chip c-gray"><div class="n">${daysUntil}</div><div class="lbl">Days Until Start</div></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">⚠️ Carryover Risk</div>
        ${carryover.length===0
          ? '<div style="color:#10b981;font-size:13px">✅ No in-progress items.</div>'
          : carryover.map(t=>{
              const pts=getPoints(t);
              return `<div class="task-row"><div class="task-id"><a href="${t.url}" target="_blank">${t.custom_id}</a></div><div class="task-name">${t.name}</div>${pts?`<span class="task-pts">${pts}pt</span>`:''}<div class="task-who">${(t.assignees||[]).map(a=>a.username.split(' ')[0]).join(', ')||'—'}</div></div>`;
            }).join('')}
      </div>

      <div class="card">
        <div class="card-title">🎯 Points by Assignee</div>
        ${ptsEntries.length===0
          ? '<div class="loading">No estimated tasks yet.</div>'
          : ptsEntries.map(([name,pts])=>`
            <div class="asgn-row">
              <div class="av" style="background:${memberColor(name)}">${memberInitials(name)}</div>
              <div class="asgn-name">${name.split(' ')[0]}</div>
              <div class="asgn-bar-track"><div class="asgn-bar-fill" style="width:${Math.round(pts/maxPts*100)}%;background:${memberColor(name)}"></div></div>
              <div class="asgn-val">${pts} pts</div>
            </div>`).join('')}
      </div>

      <div class="card full">
        <div class="card-title">📌 Committed Tasks</div>
        ${tasks.length===0
          ? '<div class="loading">No tasks committed yet.</div>'
          : tasks.map(t=>{
              const {pts,html:ptsHtml}=getPointsDisplay(t);
              const unestBadge=!pts?'<span class="st-badge st-notest">NOT EST</span>':'';
              const subs = (pts > 8 && t.subtasks?.length) ? t.subtasks.map(sub => {
                const sp = Number(sub.points) || 0;
                const ss = (sub.status?.status||sub.status||'').toLowerCase();
                const sDone = ss==='closed'||ss==='done';
                return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0 3px 12px;border-top:1px solid rgba(0,0,0,.05)">
                  <span style="font-size:9px;color:#94a3b8">↳</span>
                  <a href="${sub.url}" target="_blank" style="font-size:10px;font-weight:600;color:#94a3b8;text-decoration:none;white-space:nowrap">${sub.custom_id||''}</a>
                  <span style="font-size:11px;flex:1;color:${sDone?'#94a3b8':'#374151'};${sDone?'text-decoration:line-through':''}">${(sub.name||'').length>50?(sub.name||'').slice(0,50)+'…':(sub.name||'')}</span>
                  ${sp?`<span style="font-size:10px;font-weight:700;color:#6d28d9">${sp}pt</span>`:''}
                  ${sDone?'<span style="font-size:9px;color:#059669">✓</span>':''}
                </div>`;
              }).join('') : '';
              return `<div class="sprint-item" style="background:#eff6ff;border-left:3px solid #3b82f6;flex-direction:column;align-items:stretch;padding:0">
                <div style="display:flex;align-items:flex-start;gap:8px;padding:10px 12px">
                  <div style="min-width:88px"><div class="tid"><a href="${t.url}" target="_blank">${t.custom_id}</a></div>${unestBadge}</div>
                  <div style="flex:1"><div class="tname">${t.name}</div><div class="ta">${(t.assignees||[]).map(a=>a.username.split(' ')[0]).join(', ')||'Unassigned'}</div></div>
                  ${ptsHtml}
                </div>
                ${subs}
              </div>`;
            }).join('')}
      </div>

      <div class="card full">
        <div class="card-title">🗂️ Top Backlog Candidates</div>
        <table class="bl-table"><thead><tr><th style="width:90px">ID</th><th>Task</th><th style="width:80px">Priority</th><th style="width:110px">Assignee</th></tr></thead><tbody>
        ${candidates.map(t=>{
          const p=t.priority?.priority||'normal';
          return `<tr><td><a href="${t.url}" target="_blank">${t.custom_id}</a></td><td style="font-weight:500">${t.name}</td><td><span class="pri-badge pri-${p}">${p}</span></td><td style="color:#64748b;font-size:11px">${(t.assignees||[]).map(a=>a.username.split(' ')[0]).join(', ')||'—'}</td></tr>`;
        }).join('')}
        </tbody></table>
      </div>
    </div>`;
}

/* ══════════════════════════════════════════
   SYNC
══════════════════════════════════════════ */
async function syncNow() {
  const btn  = document.getElementById('sync-btn');
  const icon = document.getElementById('sync-icon');
  btn.disabled = true;
  btn.classList.add('spinning');
  document.getElementById('last-synced').textContent = 'Syncing…';

  try {
    // 1. Discover sprints
    const allSprints = await discoverSprints();
    sprintSlots = pickDisplaySprints(allSprints);

    // 2. Build UI shell
    buildTabs(sprintSlots);
    updateHeader(0);

    // 3. Fetch tasks for all slots + backlog in parallel
    const taskPromises = sprintSlots.map(s => fetchSprintTasks(s.id));
    const blPromise = fetchListTasks(BACKLOG_LIST_ID);
    const [blTasks, ...taskArrays] = await Promise.all([blPromise, ...taskPromises]);
    cachedBlTasks = blTasks;

    // 4. Render each panel
    sprintSlots.forEach((s, i) => {
      const panelId = `panel-${i}`;
      const tasks   = taskArrays[i] || [];
      const prevTasks = i > 0 ? taskArrays[i-1] : [];
      cachedTasks[panelId] = tasks;
      if (s.role === 'review')   renderReview(panelId, s, tasks);
      if (s.role === 'active')   renderActive(panelId, s, tasks);
      if (s.role === 'planning') renderPlanning(panelId, s, tasks, prevTasks, blTasks);
    });

    syncedAt = new Date();
    document.getElementById('last-synced').textContent = `Synced ${fmtTime(syncedAt)}`;
  } catch(e) {
    console.error('Sync failed:', e);
    document.getElementById('last-synced').textContent = '⚠️ Sync failed';
    document.getElementById('panels-container').innerHTML =
      `<div class="error-banner">❌ Sync failed: ${e.message}<br><small>Check that CLICKUP_API_KEY is set in Vercel environment variables.</small></div>`;
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
syncNow();
setInterval(() => {
  if (syncedAt) document.getElementById('last-synced').textContent = `Synced ${fmtTime(syncedAt)}`;
}, 60000);
</script>
